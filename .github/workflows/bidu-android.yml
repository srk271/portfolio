name: bidu-android

on:
  push:
    paths:
      - "bidu/**"
      - ".github/workflows/bidu-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidu-${{ github.ref }}
  cancel-in-progress: true

# The debug APK is the critical path: `build` produces it as early as possible and `publish`
# releases it. Tests and the minified release build run in parallel jobs and never delay it.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bidu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bidu-debug-apk
          path: bidu/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bidu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --continue --stacktrace --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidu-test-reports
          path: |
            bidu/core/build/reports/tests/**
            bidu/core/build/test-results/**
            bidu/app/build/reports/tests/**
            bidu/app/build/test-results/**
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bidu
    env:
      BIDU_KEYSTORE_PASSWORD: ${{ secrets.BIDU_KEYSTORE_PASSWORD }}
      BIDU_KEY_ALIAS: ${{ secrets.BIDU_KEY_ALIAS }}
      BIDU_KEY_PASSWORD: ${{ secrets.BIDU_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Decode release keystore
        id: keystore
        env:
          BIDU_KEYSTORE_BASE64: ${{ secrets.BIDU_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${BIDU_KEYSTORE_BASE64}" ] && [ -n "${BIDU_KEYSTORE_PASSWORD}" ] && [ -n "${BIDU_KEY_ALIAS}" ] && [ -n "${BIDU_KEY_PASSWORD}" ]; then
            KS="$RUNNER_TEMP/bidu-release.jks"
            printf '%s' "$BIDU_KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "BIDU_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
            echo "signing=true" >> "$GITHUB_OUTPUT"
            echo "Release signing enabled."
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "Keystore secrets not configured; release APK will be unsigned."
          fi

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Remove decoded keystore
        if: always() && steps.keystore.outputs.signing == 'true'
        run: rm -f "$RUNNER_TEMP/bidu-release.jks"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.keystore.outputs.signing == 'true' && 'bidu-release-apk' || 'bidu-release-apk-unsigned' }}
          path: bidu/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  # Publishes the debug APK as the public pre-release `bidu-latest` (approved by the owner).
  publish:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/ccr-b9cc0e68-gw642j')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: bidu-latest
      TITLE: Bidu (latest debug build)
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: bidu-debug-apk
          path: apk

      - name: Create or update the pre-release
        run: |
          set -euo pipefail
          APK="$(find apk -type f -name '*.apk' | head -n 1)"
          [ -n "$APK" ] || { echo "No APK in the downloaded artifact"; exit 1; }
          # The release asset takes the file's name, so stage it under the exact asset name.
          cp "$APK" bidu-debug.apk
          NOTES="Commit ${GITHUB_SHA:0:7}, built $(date -u '+%Y-%m-%d %H:%M UTC'). Debug build for sideloading; not Play-signed."

          # Point the tag at this commit first (move it, or create it if missing).
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${TAG}" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$GITHUB_SHA" > /dev/null
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
            gh release upload "$TAG" bidu-debug.apk --clobber
          else
            gh release create "$TAG" bidu-debug.apk --title "$TITLE" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          echo "Published https://github.com/${GH_REPO}/releases/tag/${TAG}"
